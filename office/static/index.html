<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>루프탑 가든 오피스</title>
<link rel="stylesheet" href="/office.css"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3ZM9 21v-7h6v7M7 10h2m6 0h2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="m8 12 3 3 6-6M9 4V2m6 2V2"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4M8 14h2m4 0h2m-8 3h2"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h17M7 16V9m5 7V4m5 12v-6"/></symbol></defs></svg>
<header class="topbar"><div class="brand"><div class="brand-mark"><svg class="icon"><use href="#i-home"/></svg></div><div><h1 id="brand-name"></h1><small id="brand-caption"></small></div></div><div class="top-actions"><button id="directory">부서 찾기</button></div></header>
<main class="world" id="world"><canvas id="map" tabindex="0" aria-label="픽셀 오피스. 빈 바닥을 누르거나 방향키로 이동하고, 직원이나 부서 이름을 누르면 상세 정보를 볼 수 있습니다."></canvas><div id="labels" class="labels"></div><div id="location" class="map-location">마을 입구</div><button id="nearby" class="nearby" hidden></button><div class="map-tools" aria-label="지도 보기"><button id="zoom-out" aria-label="축소">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="확대">+</button><button class="fit" id="fit">전체</button><button class="fit" id="me">내 위치</button></div></main>
<aside class="side" id="side" aria-labelledby="panel-title" hidden><header class="side-head"><div><h2 id="panel-title">오늘의 오피스</h2><small id="updated">자료 조회 중</small></div><button id="close-panel" class="close" aria-label="패널 닫기">×</button></header><div id="panel-body" class="side-body"></div></aside>
<dialog id="action-dialog" class="action-dialog" aria-labelledby="action-title" aria-describedby="action-description">
	<h2 id="action-title">반영 확인</h2><p id="action-description"></p>
	<p id="action-status" role="status" aria-live="polite"></p>
	<div id="action-result" hidden><details id="action-details"><summary>마지막 출력 20줄</summary><pre id="action-output"></pre></details><p id="action-restart" hidden></p></div>
	<div class="action-buttons"><button id="action-cancel" class="outline-button">취소</button><button id="action-confirm" class="apply-button">반영</button></div>
</dialog>
<dialog id="dev-dialog" class="action-dialog" aria-labelledby="dev-title" aria-describedby="dev-warning">
	<h2 id="dev-title">개발 지시</h2><p id="dev-warning" class="intro">회사 내용·비밀값은 적지 마세요. 기획 AI가 ai-hub 저장소의 요청서 초안을 씁니다.</p>
	<div id="dev-editor" class="dev-editor">
		<label for="dev-role">개발팀 역할</label><select id="dev-role"><option value="plan">기획</option><option value="backend">백엔드</option><option value="frontend">프론트</option><option value="design">디자인</option></select>
		<label id="dev-text-label" for="dev-text">할 일</label><textarea id="dev-text" rows="6" maxlength="2000" aria-describedby="dev-warning dev-remaining"></textarea>
		<p id="dev-remaining" class="muted">2000자 남음</p><button id="dev-write" class="apply-button" disabled>초안 쓰기</button>
	</div>
	<p id="dev-status" role="status" aria-live="polite"></p><article id="dev-card" class="dev-card" hidden></article>
	<div class="action-buttons"><button id="dev-close" class="outline-button">닫기</button><button id="dev-discard" class="outline-button" hidden>버리기</button><button id="dev-redraft" class="outline-button" hidden>다시 쓰기</button><button id="dev-run" class="apply-button" hidden>실행</button></div>
</dialog>
<nav class="bottom" aria-label="오피스 메뉴"><button data-view="office" aria-pressed="true"><svg class="icon"><use href="#i-home"/></svg>오피스</button><button data-view="approvals" aria-pressed="false"><svg class="icon"><use href="#i-check"/></svg>할 일 <span class="badge" id="approval-count">?</span></button><button data-view="schedule" aria-pressed="false"><svg class="icon"><use href="#i-cal"/></svg>일정</button><button data-view="status" aria-pressed="false"><svg class="icon"><use href="#i-chart"/></svg>현황</button></nav>
<div class="hint"><kbd>방향키 / WASD</kbd> 이동 · 바닥 클릭<br>직원 선택 · 드래그로 지도 이동</div><div class="toast" id="toast" role="status" hidden></div><div class="sr-only" id="live" aria-live="polite"></div>

<script src="/pixel-art.js" defer></script>
<script src="/office.js" defer></script>
</body></html>
