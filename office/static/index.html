<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>ai-hub 사무실</title>
<style>
:root{--ink:#5b4b6e;--slate:#cfe3dc;--muted:#8f82a3;--paper:#fffaf3;--line:#eadff6;--green:#3f9a70;--mint:#cdf5ea;--yellow:#ffe9a8;--pink:#ffe6cf;--hot:#5fae95;--lav:#efe6fc;--font:ui-monospace,"SFMono-Regular",Consolas,"Apple SD Gothic Neo","Malgun Gothic",monospace}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#cfe6da;color:var(--ink);font:13px/1.5 var(--font)}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,canvas:focus-visible{outline:3px solid var(--hot);outline-offset:4px}button:disabled{cursor:not-allowed}button:active:not(:disabled){translate:0 2px}[hidden]{display:none!important}h1,h2,h3,p{margin:0}::selection{background:var(--pink)}
#world{position:fixed;inset:0 0 56px;overflow:hidden;background:#cfe6da}#map{position:absolute;display:block;image-rendering:pixelated;touch-action:none;outline-offset:-5px}#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}.at{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--slate)}
.topbar{position:fixed;z-index:5;inset:14px 18px auto;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:10px}.brand,.timebox{display:flex;align-items:center;pointer-events:auto}.brand{gap:10px;padding:6px 14px 6px 8px}.brand h1{font-size:16px;letter-spacing:-.6px}.brand h1 span{color:var(--hot)}.brand-mark{width:28px;height:28px;image-rendering:pixelated;border-radius:6px}.sample{border-left:2px dotted var(--line);padding-left:10px;font-size:11px;color:var(--muted)}.timebox{gap:12px;padding:5px 14px}.timebox time{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.timebox small{color:var(--muted);font-size:10px;display:block;line-height:1}.location{color:var(--paper);background:var(--green);border-radius:999px;font-size:11px;padding:2px 10px}
.roster{position:fixed;z-index:5;top:76px;left:18px;width:196px;overflow:hidden}.roster>summary{padding:6px 11px;cursor:pointer;font-size:11px;list-style:none;display:flex;justify-content:space-between;align-items:center;background:var(--mint)}.roster>summary::-webkit-details-marker{display:none}.roster>summary::after{content:'−';font-size:15px}.roster:not([open])>summary::after{content:'+'}.online-count{display:inline-block;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 6px;margin-left:4px;font-size:10px}.people{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);padding:5px;gap:2px}.person{display:flex;align-items:center;gap:6px;min-height:27px;text-align:left;border:0;border-radius:6px;background:transparent;font-size:10px;padding:3px 6px}.person:hover{background:var(--mint)}.dot{display:inline-block;width:7px;height:7px;flex-shrink:0;border-radius:50%;background:#5cb488;box-shadow:0 0 0 1.5px var(--ink)}.person[data-state="쉬는 중"] .dot,.name[data-state="쉬는 중"] .dot{background:#b096e0}.person[data-state="대기 중"] .dot,.name[data-state="대기 중"] .dot{background:#80aef0}.person[data-state="상태 미확인"] .dot,.name[data-state="상태 미확인"] .dot{background:#d6cfe0}.person[data-state="이동 중"] .dot,.name[data-state="이동 중"] .dot{background:#ffc98f}.roster-note{padding:0 10px 6px;color:var(--muted);font-size:9px}
.room-name{font-size:11px;font-weight:800;background:var(--paper);padding:0 9px;border:2px solid var(--ink);border-radius:999px;box-shadow:0 2px 0 var(--slate)}.room-name small{font-size:9px;font-weight:600;color:var(--hot);margin-left:5px}.name{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:10px;box-shadow:0 2px 0 var(--slate);pointer-events:auto;min-height:20px;line-height:16px}.name:hover{background:var(--mint)}.name .dot{width:5px;height:5px;margin-right:4px;vertical-align:1px}.name.me{color:var(--paper);background:var(--hot);padding:0 10px}.bubble{padding:4px 10px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--slate);font-size:11px;line-height:1.4;z-index:2}.bubble::after{content:'';position:absolute;left:calc(50% - 4px);bottom:-6px;width:7px;height:7px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}.bubble.work{background:var(--mint)}.bubble.warn{background:var(--pink)}.bubble.dnd{background:var(--yellow)}.place{pointer-events:auto;background:var(--paper);border:2px solid var(--ink);border-radius:999px;box-shadow:0 2px 0 var(--slate);font-size:10px;padding:0 9px;min-height:22px}.place:hover{background:var(--mint)}.badge{display:inline-block;color:#fff;background:var(--hot);border-radius:999px;padding:0 5px;min-width:16px;text-align:center;margin-left:3px}.board-hit{pointer-events:auto;position:absolute;transform:none;border:0;border-radius:4px;background:transparent;color:var(--ink);text-align:left;padding:8px 13px;font-size:10px;line-height:1.65}.board-hit b{font-size:12px}.board-hit small{font-size:9px;color:var(--hot)}.board-hit:hover{outline:3px dashed var(--hot)}#proximity{z-index:4;color:#fff;background:var(--ink);border-radius:999px;font-size:11px;padding:3px 11px;box-shadow:0 3px 0 var(--slate)}#proximity kbd{color:var(--yellow)}
.scene-log{position:fixed;z-index:5;bottom:70px;left:18px;max-width:400px;padding:7px 13px;font-size:11px;pointer-events:none}.scene-log small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.scene-log strong{color:var(--green)}.scene-log strong::before{content:'♥ ';color:var(--hot)}.scene-controls{position:fixed;z-index:6;right:18px;bottom:70px;display:flex;gap:6px}.mini-button{background:var(--paper);border:2px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--slate);padding:4px 12px;min-height:32px;font-size:10px}.mini-button:hover{background:var(--mint)}
.footer{position:fixed;z-index:10;inset:auto 0 0;height:56px;background:var(--paper);color:var(--ink);border-top:3px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}.instructions{display:flex;align-items:center;gap:18px;font-size:11px}.instructions span{color:var(--muted)}kbd{font:inherit;font-weight:800;background:var(--lav);border:2px solid var(--ink);border-bottom-width:3px;border-radius:5px;padding:0 5px}.footer-actions{display:flex;align-items:center;gap:12px}.footer-actions small{color:var(--muted);font-size:10px}
dialog{position:fixed;inset:auto 0 82px;margin:0 auto;width:min(790px,calc(100% - 36px));max-height:calc(100dvh - 120px);padding:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--slate);font:13px/1.6 var(--font);overflow:auto}dialog::backdrop{background:#4b5a5a33}.panel-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ink);padding:9px 16px;background:var(--mint)}.panel-head h2{font-size:15px}.panel-head small{font-size:10px;color:var(--muted)}.close{border:2px solid var(--ink);border-radius:50%;background:var(--paper);width:34px;height:34px;font-size:17px}.close:hover{background:var(--yellow)}.panel-body{padding:20px}.employee{display:grid;grid-template-columns:100px 1fr;gap:22px}.portrait{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:12px}.employee h3{font-size:18px;margin:1px 0 12px}.employee h3 small{font-size:11px;background:var(--mint);border-radius:999px;padding:1px 8px;margin-left:4px}.employee dl{display:grid;grid-template-columns:85px 1fr;gap:7px 12px;margin:0;font-size:12px}.employee dt{color:var(--muted)}.employee dd{margin:0}.panel-foot{display:flex;justify-content:space-between;align-items:center;border-top:2px dotted var(--line);margin-top:18px;padding-top:13px;gap:12px;font-size:11px;color:var(--muted)}.assign{padding:7px 18px;background:var(--lav);border:2px solid #c9bde0;border-radius:999px;color:var(--muted);font-weight:700}.stage-label{display:block;font-size:10px;text-align:center;margin-top:3px}.columns{display:grid;grid-template-columns:1.12fr 1fr;gap:28px}.columns h3,.approval h3{font-size:12px;margin-bottom:12px;color:var(--green)}.progress-row{margin:11px 0 17px;font-size:12px}.progress-row>div{display:flex;justify-content:space-between;margin-bottom:5px}.progress-row small{color:var(--muted)}.track{height:12px;background:var(--lav);border:2px solid var(--ink);border-radius:999px;overflow:hidden}.track i{height:100%;display:block;background:repeating-linear-gradient(90deg,#8fd4b8 0 6px,#b4e6d2 6px 12px)}.schedule{padding:0;margin:0;list-style:none;font-size:12px}.schedule li{padding:8px 0;border-bottom:2px dotted var(--line)}.schedule time{color:var(--hot);font-weight:800;display:inline-block;width:48px}.usage{background:var(--mint);border:2px solid var(--ink);border-radius:10px;padding:9px 11px;margin-top:16px;font-size:12px}.approval-summary{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:20px}.approval-summary div{padding:12px;border-right:2px dotted var(--line);font-size:11px}.approval-summary div:nth-child(1){background:var(--pink)}.approval-summary div:nth-child(2){background:var(--mint)}.approval-summary div:nth-child(3){background:var(--yellow);border:0}.approval-summary strong{display:block;font-size:25px}.decisions{padding-left:22px;font-size:12px}.decisions li{padding:7px 0}.notice{padding:10px 13px;background:var(--pink);border:2px solid var(--ink);border-radius:10px;font-size:12px}#toast{position:fixed;z-index:30;left:50%;bottom:80px;transform:translateX(-50%);max-width:calc(100% - 30px);padding:9px 18px;font-size:12px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:1100px){.instructions{gap:10px;font-size:10px}.footer-actions small{display:none}.sample{display:none}.roster{width:184px}.person{font-size:9px}.location{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(max-width:760px){.topbar{inset:10px 12px auto}.brand{padding:5px 9px;gap:7px}.brand h1{font-size:13px}.timebox{padding:4px 8px;gap:6px}.timebox time{font-size:14px}.timebox small,.location{display:none}.roster{top:62px;left:12px;width:168px}.scene-log{left:12px;bottom:68px;max-width:calc(100% - 150px);font-size:10px}.scene-log small{display:none}.scene-controls{right:12px;bottom:68px;gap:4px}.mini-button{font-size:9px;padding:3px 8px}.footer{padding:0 12px;gap:8px}.instructions{font-size:9px;display:block}.instructions span{display:block}.footer-actions{gap:0}.columns{grid-template-columns:1fr;gap:10px}.employee{grid-template-columns:64px 1fr;gap:12px}.portrait{width:64px;height:64px}.employee h3{font-size:15px}.employee dl{grid-template-columns:70px 1fr;font-size:11px;gap:6px}.panel-body{padding:14px}.approval-summary div{padding:8px}.approval-summary strong{font-size:21px}.panel-foot{font-size:10px}.name{font-size:9px}.bubble{font-size:10px;padding:3px 7px}.room-name{font-size:10px}.room-name small{display:none}.board-hit{font-size:9px;padding:4px 6px}.board-hit b{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}button:active:not(:disabled){translate:none}}
.name[data-state="꺼짐"],.person[data-state="꺼짐"]{opacity:.45}.name[data-state="확인 불가"] .dot,.person[data-state="확인 불가"] .dot{background:#ff7f93}.reply{margin:10px 0 18px;padding:10px;border:2px dotted var(--line);border-radius:8px;overflow-wrap:anywhere}.reply code{display:block;margin:6px 0}.schedule time{width:auto;margin-right:8px}.notice{margin:8px 0}.job{margin-bottom:18px}.job h3{margin-bottom:5px}.activity-list{padding-left:22px}.activity-list li{margin-bottom:10px}.activity-list time{color:var(--muted)}a{color:var(--green)}
</style>
</head>
<body>
<main id="world" aria-label="픽셀 사무실 탐색">
	<canvas id="map" tabindex="0" aria-label="탑다운 픽셀 사무실. 방향키 또는 WASD로 이동하고 Space로 가까운 직원이나 장소와 상호작용하세요.">사무실 탐색은 접속 중 직원 버튼과 현황판, 결재함, 회의 소집 버튼으로도 할 수 있습니다.</canvas>
	<div id="labels"><div id="proximity" class="at" hidden><kbd>Space</kbd>: 말 걸기</div></div>
</main>
<header class="topbar">
	<div class="brand card"><canvas class="brand-mark" id="logo" width="16" height="16" aria-hidden="true"></canvas><h1>ai-hub <span>사무실</span></h1><span class="sample">로컬 자료 · 보기 전용</span></div>
	<div class="timebox card"><span class="location" id="location">입구 · 결재 데스크</span><div><time id="clock">00:00</time><small id="date">10.23 금요일</small></div></div>
</header>
<details class="roster card" open><summary><b>접속 중 <span class="online-count">…</span></b></summary><div id="people" class="people"></div><p class="roster-note">이름 선택 → 찾아가서 말 걸기</p></details>
<aside class="scene-log card" aria-label="최근 활동"><strong id="event-title">자료를 읽고 있습니다</strong><small id="event-detail">10초마다 갱신 · 보기 전용</small></aside>
<footer class="footer"><div class="instructions"><div><kbd>방향키 / WASD</kbd> 이동 <span style="display:inline">· 바닥 클릭</span></div><span><kbd>Space</kbd> 말 걸기 <span style="display:inline">·</span> <kbd>Esc</kbd> 닫기</span></div><div class="footer-actions"><small id="sync-state" role="status">자료 조회 중</small><button id="machine" class="mini-button">기계실</button><button id="activity" class="mini-button">활동 기록</button></div></footer>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><div><h2 id="panel-title"></h2><small>ai-hub 사무실 · 보기 전용</small></div><button class="close" id="close" aria-label="대화창 닫기">×</button></div><div class="panel-body" id="panel-body"></div></dialog>
<div id="toast" class="card" role="status" hidden></div><div class="sr-only" id="live" aria-live="polite"></div>
<script src="/office.js"></script>
</body>
</html>
