# 요금제 설정 견본. 실제 파일은 ~/.ai-hub/plans.toml 이다.
# allow에 없는 분류의 자료는 그 요금제로 보내지 않는다. 회사 자료는 회사 정책이 허용할 때만 연다.

[[plans]]
id = "p01"
tool = "claude"          # claude | codex | agy
plan = "구독"            # 자유 입력
owner = "personal"       # personal | company
allow = ["personal", "study", "career"]
model = ""               # 비우면 CLI 기본 모델, 실제 값은 로컬 설정에만 둔다
daily_limit_calls = 30   # 비우면 상한 없음

[[plans]]
id = "p02"
tool = "codex"
plan = "구독"
owner = "personal"
allow = ["personal", "study", "career"]

[[plans]]
id = "p03"
type = "ollama"
plan = "로컬"
owner = "personal"
allow = ["personal", "study", "career"]
model = "xyz"            # 합성 이름. 실제로 설치한 모델명은 로컬 설정에만 둔다
url = "http://localhost:11434" # 생략하면 이 주소
timeout = 300            # 응답 제한(초), 기본 300. 설치·모델 다운로드는 별도 수행

[routing]
personal = ["p01", "p02"]
study = ["p01", "p02"]
career = ["p01", "p02"]
company = []             # C1은 최소 기록, C4는 정제 보류(완료로 세지 않음)

[backfill]
daily_limit_calls = 20   # C4 구독 호출 합산, 실패·시간 초과·대체 호출 포함
batch_size = 10          # 한 묶음의 대화 결과 수
# [backfill.routing]을 생략하면 기존 routing을 따른다.
# 회사용 재정의는 기존 routing.company에 있는 요금제만 허용한다.
# 비교할 때는 해당 분류의 routing에 로컬·구독 요금제를 모두 등록한다.
# python3 -m collector backfill --compare p01 --count 20
# 비교는 모델별로 허용된 첫 후보를 사용하며 볼트에 쓰지 않는다.
# 사람이 로컬 채택을 결정하면 아래처럼 로컬을 앞에 둔다.
# [backfill.routing]
# personal = ["p03", "p01", "p02"]
# study = ["p03", "p01", "p02"]
# career = ["p03", "p01", "p02"]
